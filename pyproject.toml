[project]
name = "vg-data-visor"
version = "0.1.0"
description = "Local SQLite database viewer and editor with Semantic UI (Fomantic-UI) and FastAPI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
