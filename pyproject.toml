[project]
name = "tabula"
version = "0.1.0"
description = "Local database viewer and editor for SQLite, PostgreSQL, and MongoDB with Semantic UI (Fomantic-UI) and FastAPI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "pymongo>=4.6",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
    "mongomock>=4.1",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
